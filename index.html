<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnowSlate - Field Observation Suite</title>

    <!-- Web Application & PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SnowSlate">
    <meta name="application-name" content="SnowSlate">
    <meta name="theme-color" content="#0F172A">

    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2530/2530068.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2530/2530068.png">
    <link rel="manifest" href="./manifest.json">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#0B132B',
                            900: '#1C2541',
                            800: '#3A506B',
                            700: '#4A6183',
                            600: '#5C769D'
                        },
                        cyan: {
                            400: '#38BDF8',
                            500: '#0EA5E9',
                            600: '#0284C7'
                        },
                        amber: {
                            400: '#F59E0B',
                            500: '#D97706'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3A506B; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4A6183; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* High-Contrast Solar Mode Overrides */
        body.solar-mode {
            background-color: #FFFFFF !important;
            color: #000000 !important;
        }
        body.solar-mode .solar-card {
            background-color: #F1F5F9 !important;
            border-color: #000000 !important;
            color: #000000 !important;
        }
        body.solar-mode input, body.solar-mode select, body.solar-mode textarea {
            background-color: #FFFFFF !important;
            color: #000000 !important;
            border-color: #000000 !important;
            font-weight: 700 !important;
        }
        body.solar-mode .solar-header {
            background-color: #0F172A !important;
            color: #FFFFFF !important;
        }
        body.solar-mode .solar-btn-active {
            background-color: #000000 !important;
            color: #FFFFFF !important;
            border-color: #000000 !important;
        }
        body.solar-mode svg {
            background-color: #FFFFFF !important;
            border-color: #000000 !important;
        }
        body.solar-mode svg line {
            stroke: #475569 !important;
        }
        body.solar-mode svg text {
            fill: #000000 !important;
            font-weight: bold !important;
        }
    </style>
</head>
<body class="bg-[#0B132B] text-slate-100 min-h-screen font-sans p-1 sm:p-6 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('gen_obs');
            const [colorPalette, setColorPalette] = useState('dim');
            
            const createInitialObsState = () => ({
                id: Date.now().toString(),
                createdAt: new Date().toISOString(),
                locationName: '',
                observerName: '',
                elevation: '',
                aspect: 'N',
                slopeAngle: '',
                lat: 0,
                lng: 0,
                pitLat: 0,
                pitLng: 0,
                pitElevation: '',
                pitSlopeAngle: '',
                totalSnowDepth: '',
                generalNotes: '',
                photos: [],
                weather: {
                    skyCover: 'CLR',
                    airTemp: '',
                    windSpeed: 'Calm'
                },
                instability: {
                    recentAvalanches: false,
                    avalanches: [],
                    cracking: false,
                    crackingExtent: 'Isolated',
                    collapsing: false,
                    collapsingExtent: 'Isolated',
                    windLoading: false,
                    windLoadingRate: 'Light',
                    windLoadingDirection: 'N',
                    snowAvailableForTransport: 'Moderate',
                    showAllParameters: true
                },
                layers: [],
                pstTests: [],
                snowTemps: []
            });

            const [obs, setObs] = useState(createInitialObsState);
            const [savedLogbook, setSavedLogbook] = useState([]);
            const [statusMsg, setStatusMsg] = useState('');
            const [isRecording, setIsRecording] = useState(false);
            const [isDictatingLayers, setIsDictatingLayers] = useState(false);
            const [isFetchingGps, setIsFetchingGps] = useState(false);
            const [isFetchingPitGps, setIsFetchingPitGps] = useState(false);
            const [showPstSection, setShowPstSection] = useState(false);
            const [showTempSection, setShowTempSection] = useState(false);

            // Logbook Grouping, Search, and Filtering States
            const [searchQuery, setSearchQuery] = useState('');
            const [groupBy, setGroupBy] = useState('date');
            const [filterTag, setFilterTag] = useState('all');
            const [selectedReportModal, setSelectedReportModal] = useState(null);

            // Native Capacitor SQLite Implementation
            const initCapacitorSqlite = async () => {
                if (window.Capacitor && window.Capacitor.isNativePlatform() && window.CapacitorSQLite) {
                    try {
                        const sqlite = window.CapacitorSQLite;
                        const db = await sqlite.createConnection({
                            database: 'snowslate.db',
                            encrypted: false,
                            mode: 'no-encryption',
                            version: 1,
                            readonly: false
                        });
                        await db.open();
                        await db.execute(`
                            CREATE TABLE IF NOT EXISTS logbook (
                                id TEXT PRIMARY KEY NOT NULL,
                                createdAt TEXT,
                                data TEXT
                            );
                        `);
                        return db;
                    } catch (e) {
                        console.error('Capacitor SQLite init error:', e);
                    }
                }
                return null;
            };

            useEffect(() => {
                const loadLogs = async () => {
                    const db = await initCapacitorSqlite();
                    if (db) {
                        try {
                            const result = await db.query('SELECT data FROM logbook ORDER BY createdAt DESC;');
                            const logs = result.values ? result.values.map(row => JSON.parse(row.data)) : [];
                            setSavedLogbook(logs);
                            return;
                        } catch (e) {
                            console.error('Failed to load from native SQLite, falling back to localStorage', e);
                        }
                    }
                    // Fallback to localStorage for web/PWA mode
                    const storedLogs = localStorage.getItem('snowslate_logbook');
                    if (storedLogs) {
                        try {
                            setSavedLogbook(JSON.parse(storedLogs));
                        } catch (e) {
                            console.error('Failed to parse logbook from localStorage', e);
                        }
                    }
                };
                loadLogs();
            }, []);

            useEffect(() => {
                if (colorPalette === 'bright') {
                    document.body.classList.add('solar-mode');
                } else {
                    document.body.classList.remove('solar-mode');
                }
            }, [colorPalette]);

            const saveLogbookToStorage = async (newLogs) => {
                setSavedLogbook(newLogs);
                const db = await initCapacitorSqlite();
                if (db) {
                    try {
                        for (const item of newLogs) {
                            await db.run(
                                'INSERT OR REPLACE INTO logbook (id, createdAt, data) VALUES (?, ?, ?);',
                                [item.id, item.createdAt, JSON.stringify(item)]
                            );
                        }
                        return;
                    } catch (e) {
                        console.error('Failed to save to native SQLite, falling back to localStorage', e);
                    }
                }
                localStorage.setItem('snowslate_logbook', JSON.stringify(newLogs));
            };

            const deleteLogFromStorage = async (id) => {
                const newLogs = savedLogbook.filter(item => item.id !== id);
                setSavedLogbook(newLogs);
                const db = await initCapacitorSqlite();
                if (db) {
                    try {
                        await db.run('DELETE FROM logbook WHERE id = ?;', [id]);
                        return;
                    } catch (e) {
                        console.error('Failed to delete from native SQLite', e);
                    }
                }
                localStorage.setItem('snowslate_logbook', JSON.stringify(newLogs));
            };

            const hardnessLevels = ['F', '4F', '1F', 'P', 'K', 'I'];
            const grainTypesList = [
                { code: 'PP', name: 'New Snow', symbol: '+' },
                { code: 'PPgp', name: 'Graupel', symbol: '✼' },
                { code: 'DF', name: 'Decomposing Particles', symbol: '/' },
                { code: 'RG', name: 'Rounds', symbol: '●' },
                { code: 'RGxf', name: 'Rounds to Facets', symbol: '▅' },
                { code: 'FC', name: 'Facets', symbol: '□' },
                { code: 'FCsf', name: 'Near Surface Facets', symbol: '▨' },
                { code: 'SH', name: 'Surface Hoar', symbol: 'V' },
                { code: 'DH', name: 'Depth Hoar', symbol: '∧' },
                { code: 'FCxr', name: 'Facets to Rounds', symbol: '∩' },
                { code: 'MF', name: 'Melt Forms', symbol: '○' },
                { code: 'MFcr', name: 'Melt Freeze Crust', symbol: '∞' }
            ];

            const togglePalette = () => {
                const next = colorPalette === 'dim' ? 'bright' : 'dim';
                setColorPalette(next);
                setStatusMsg(next === 'bright' ? 'High-Contrast Bright Day Mode' : 'Dim Day / Headlamp Mode');
                setTimeout(() => setStatusMsg(''), 2500);
            };

            const fetchGpsLocation = () => {
                if (!navigator.geolocation) {
                    alert('Geolocation is not supported by your browser.');
                    return;
                }
                setIsFetchingGps(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude, altitude } = position.coords;
                        const hasAltitude = altitude !== null && altitude !== undefined && !isNaN(altitude);
                        const elevationFeet = hasAltitude ? Math.round(altitude * 3.28084).toString() : obs.elevation;

                        setObs(prev => ({
                            ...prev,
                            lat: latitude,
                            lng: longitude,
                            elevation: elevationFeet
                        }));
                        setIsFetchingGps(false);
                        setStatusMsg(hasAltitude ? 'General GPS & Elevation acquired!' : 'General GPS acquired');
                        setTimeout(() => setStatusMsg(''), 3000);
                    },
                    (error) => {
                        setIsFetchingGps(false);
                        alert(`Unable to retrieve GPS location: ${error.message}`);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const fetchPitGpsLocation = () => {
                if (!navigator.geolocation) {
                    alert('Geolocation is not supported by your browser.');
                    return;
                }
                setIsFetchingPitGps(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude, altitude } = position.coords;
                        const hasAltitude = altitude !== null && altitude !== undefined && !isNaN(altitude);
                        const pitElevationFeet = hasAltitude ? Math.round(altitude * 3.28084).toString() : obs.pitElevation;

                        setObs(prev => ({
                            ...prev,
                            pitLat: latitude,
                            pitLng: longitude,
                            pitElevation: pitElevationFeet
                        }));
                        setIsFetchingPitGps(false);
                        setStatusMsg(hasAltitude ? 'Pit GPS & Elevation acquired!' : 'Pit GPS acquired');
                        setTimeout(() => setStatusMsg(''), 3000);
                    },
                    (error) => {
                        setIsFetchingPitGps(false);
                        alert(`Unable to retrieve pit GPS location: ${error.message}`);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const captureSlopeFromSensor = (field = 'slopeAngle') => {
                if (typeof window.DeviceOrientationEvent === 'undefined') {
                    alert('Device orientation sensors are not supported on this device/browser.');
                    return;
                }

                const readOrientation = (event) => {
                    if (event.beta === null || event.beta === undefined) {
                        alert('Unable to read orientation data from device.');
                        window.removeEventListener('deviceorientation', readOrientation);
                        return;
                    }
                    let slope = Math.round(Math.abs(event.beta));
                    if (slope > 90) slope = 180 - slope;

                    setObs(prev => ({
                        ...prev,
                        [field]: slope.toString()
                    }));

                    setStatusMsg(`Slope angle (${slope}°) captured from sensor!`);
                    setTimeout(() => setStatusMsg(''), 3000);
                    window.removeEventListener('deviceorientation', readOrientation);
                };

                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', readOrientation);
                            } else {
                                alert('Sensor permission denied.');
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            alert('Error requesting sensor permission.');
                        });
                } else {
                    window.addEventListener('deviceorientation', readOrientation);
                }
            };

            const recordAvalancheGps = (avalancheId) => {
                if (!navigator.geolocation) {
                    alert('Geolocation is not supported by your browser.');
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        setObs(prev => ({
                            ...prev,
                            instability: {
                                ...prev.instability,
                                avalanches: prev.instability.avalanches.map(a => 
                                    a.id === avalancheId ? { ...a, lat: latitude, lng: longitude } : a
                                )
                            }
                        }));
                        setStatusMsg('Avalanche GPS recorded!');
                        setTimeout(() => setStatusMsg(''), 3000);
                    },
                    (error) => {
                        alert(`Unable to retrieve GPS location: ${error.message}`);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const addAvalanche = () => {
                setObs(prev => ({
                    ...prev,
                    instability: {
                        ...prev.instability,
                        avalanches: [
                            ...(prev.instability.avalanches || []),
                            {
                                id: Date.now().toString(),
                                elevation: prev.elevation || '',
                                aspect: prev.aspect || 'N',
                                timeFrame: 'Today',
                                trigger: 'N',
                                problemType: '',
                                size: 'D2',
                                rScale: 'R1',
                                lat: 0,
                                lng: 0
                            }
                        ]
                    }
                }));
            };

            const removeAvalanche = (id) => {
                setObs(prev => ({
                    ...prev,
                    instability: {
                        ...prev.instability,
                        avalanches: prev.instability.avalanches.filter(a => a.id !== id)
                    }
                }));
            };

            const handleAvalancheChange = (id, field, value) => {
                setObs(prev => ({
                    ...prev,
                    instability: {
                        ...prev.instability,
                        avalanches: prev.instability.avalanches.map(a => a.id === id ? { ...a, [field]: value } : a)
                    }
                }));
            };

            const handlePhotoUpload = (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                const newPhotos = files.map(file => ({
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    name: file.name,
                    url: URL.createObjectURL(file)
                }));
                setObs(prev => ({
                    ...prev,
                    photos: [...(prev.photos || []), ...newPhotos]
                }));
                e.target.value = null;
            };

            const removePhoto = (photoId) => {
                setObs(prev => ({
                    ...prev,
                    photos: prev.photos.filter(p => p.id !== photoId)
                }));
            };

            const startVoiceDictation = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Speech recognition is not supported in this browser.");
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onstart = () => setIsRecording(true);
                recognition.onend = () => setIsRecording(false);
                recognition.onerror = () => setIsRecording(false);
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    setObs(prev => ({
                        ...prev,
                        generalNotes: prev.generalNotes ? prev.generalNotes + ' ' + transcript : transcript
                    }));
                };
                recognition.start();
            };

            const parseAudioToLayers = (transcript) => {
                const text = transcript.toLowerCase();
                const newLayers = [];

                const numberWords = { zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90, hundred:100 };
                
                let cleanText = text;
                Object.keys(numberWords).forEach(word => {
                    cleanText = cleanText.replace(new RegExp(`\\b${word}\\b`, 'g'), numberWords[word]);
                });

                const sentences = cleanText.split(/(?:\.|\n|layer)+/).filter(s => s.trim().length > 0);

                sentences.forEach(sentence => {
                    const depthMatch = sentence.match(/(\d+)\s*(?:to|-)\s*(\d+)/i);
                    let top = depthMatch ? parseInt(depthMatch[1], 10) : null;
                    let bottom = depthMatch ? parseInt(depthMatch[2], 10) : null;

                    if (top === null && bottom === null) {
                        const singleDepth = sentence.match(/(\d+)\s*(?:cm|centimeters)/i);
                        if (singleDepth) {
                            top = newLayers.length > 0 ? newLayers[newLayers.length - 1].bottomDepth : 0;
                            bottom = parseInt(singleDepth[1], 10);
                        }
                    }

                    if (top !== null && bottom !== null) {
                        let hardness = 'F';
                        if (sentence.includes('four finger') || sentence.includes('4f') || sentence.includes('4 finger')) hardness = '4F';
                        else if (sentence.includes('one finger') || sentence.includes('1f') || sentence.includes('1 finger')) hardness = '1F';
                        else if (sentence.includes('pencil') || sentence.includes(' p ')) hardness = 'P';
                        else if (sentence.includes('knife') || sentence.includes(' k ')) hardness = 'K';
                        else if (sentence.includes('ice') || sentence.includes(' i ')) hardness = 'I';
                        else if (sentence.includes('fist') || sentence.includes(' f ')) hardness = 'F';

                        let grainType = '';
                        if (sentence.includes('graupel')) grainType = 'PPgp';
                        else if (sentence.includes('decomposing')) grainType = 'DF';
                        else if (sentence.includes('rounds to facets')) grainType = 'RGxf';
                        else if (sentence.includes('facets to rounds')) grainType = 'FCxr';
                        else if (sentence.includes('near surface') || sentence.includes('surface facets')) grainType = 'FCsf';
                        else if (sentence.includes('rounds') || sentence.includes('rounded')) grainType = 'RG';
                        else if (sentence.includes('facets') || sentence.includes('faceted')) grainType = 'FC';
                        else if (sentence.includes('surface hoar')) grainType = 'SH';
                        else if (sentence.includes('depth hoar')) grainType = 'DH';
                        else if (sentence.includes('melt freeze') || sentence.includes('crust')) grainType = 'MFcr';
                        else if (sentence.includes('melt') || sentence.includes('moist')) grainType = 'MF';
                        else if (sentence.includes('new snow') || sentence.includes('fresh')) grainType = 'PP';

                        const sizeMatch = sentence.match(/(\d+(?:\.\d+)?)\s*(?:mm|millimeter|millimeters)/i);
                        const grainSize = sizeMatch ? sizeMatch[1] : '1.0';

                        const testMatch = sentence.match(/(ct[l|m|h]?\s*\d+|ect[p|n]?\s*\d+|pst\s*\d+\/\d+)/i);
                        const stabilityTest = testMatch ? testMatch[0].toUpperCase() : '';

                        newLayers.push({
                            id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                            topDepth: top,
                            bottomDepth: bottom,
                            hardness,
                            grainType,
                            grainSize,
                            stabilityTest
                        });
                    }
                });

                if (newLayers.length > 0) {
                    setObs(prev => ({
                        ...prev,
                        layers: [...prev.layers, ...newLayers]
                    }));
                    setStatusMsg(`Added ${newLayers.length} layer(s) from voice!`);
                    setTimeout(() => setStatusMsg(''), 3000);
                } else {
                    alert(`Could not detect layer structure. Spoken phrase: "${transcript}".`);
                }
            };

            const startLayerVoiceDictation = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Speech recognition is not supported in this browser.");
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onstart = () => setIsDictatingLayers(true);
                recognition.onend = () => setIsDictatingLayers(false);
                recognition.onerror = () => setIsDictatingLayers(false);
                recognition.onresult = (event) => {
                    parseAudioToLayers(event.results[0][0].transcript);
                };
                recognition.start();
            };

            const handleLayerChange = (id, field, value) => {
                setObs(prev => ({
                    ...prev,
                    layers: prev.layers.map(l => l.id === id ? { ...l, [field]: value } : l)
                }));
            };

            const addLayer = () => {
                const last = obs.layers[obs.layers.length - 1];
                const top = last ? Number(last.bottomDepth) : 0;
                setObs(prev => ({
                    ...prev,
                    layers: [...prev.layers, { id: Date.now().toString(), topDepth: top, bottomDepth: top + 20, hardness: 'F', grainType: '', grainSize: '1.0', stabilityTest: '' }]
                }));
            };

            const removeLayer = (id) => {
                setObs(prev => ({ ...prev, layers: prev.layers.filter(l => l.id !== id) }));
            };

            const addPstTest = () => {
                setObs(prev => ({
                    ...prev,
                    pstTests: [...prev.pstTests, { id: Date.now().toString(), depth: 40, result: 'PST 30/100 (End)' }]
                }));
            };

            const handlePstChange = (id, field, value) => {
                setObs(prev => ({
                    ...prev,
                    pstTests: prev.pstTests.map(p => p.id === id ? { ...p, [field]: value } : p)
                }));
            };

            const removePstTest = (id) => {
                setObs(prev => ({ ...prev, pstTests: prev.pstTests.filter(p => p.id !== id) }));
            };

            const addTempPoint = () => {
                const last = obs.snowTemps[obs.snowTemps.length - 1];
                const nextDepth = last ? Number(last.depth) + 10 : 10;
                setObs(prev => ({
                    ...prev,
                    snowTemps: [...prev.snowTemps, { id: Date.now().toString(), depth: nextDepth, temp: '-2.0' }]
                }));
            };

            const handleTempChange = (id, field, value) => {
                setObs(prev => ({
                    ...prev,
                    snowTemps: prev.snowTemps.map(t => t.id === id ? { ...t, [field]: value } : t)
                }));
            };

            const removeTempPoint = (id) => {
                setObs(prev => ({ ...prev, snowTemps: prev.snowTemps.filter(t => t.id !== id) }));
            };

            const saveRecord = () => {
                const updatedObs = {
                    ...obs,
                    id: obs.id || Date.now().toString(),
                    createdAt: obs.createdAt || new Date().toISOString()
                };
                const existingIdx = savedLogbook.findIndex(item => item.id === updatedObs.id);
                let newLogs;
                if (existingIdx >= 0) {
                    newLogs = [...savedLogbook];
                    newLogs[existingIdx] = updatedObs;
                } else {
                    newLogs = [updatedObs, ...savedLogbook];
                }
                saveLogbookToStorage(newLogs);
                setStatusMsg('Record saved to Logbook!');
                setTimeout(() => setStatusMsg(''), 3000);
            };

            const deleteRecord = (id) => {
                if (confirm('Are you sure you want to delete this observation log?')) {
                    deleteLogFromStorage(id);
                    if (selectedReportModal?.id === id) setSelectedReportModal(null);
                    setStatusMsg('Observation deleted.');
                    setTimeout(() => setStatusMsg(''), 2500);
                }
            };

            const loadRecordToActiveSession = (record) => {
                setObs(JSON.parse(JSON.stringify(record)));
                setSelectedReportModal(null);
                setActiveTab('gen_obs');
                setStatusMsg('Loaded observation into active workspace');
                setTimeout(() => setStatusMsg(''), 3000);
            };

            const createNewSession = () => {
                setObs(createInitialObsState());
                setActiveTab('gen_obs');

            const exportCAAML = () => {

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${(obs.locationName || 'SnowSlate_Pit').replace(/\s+/g, '_')}_CAAML.xml`;
                a.click();

            const exportGPX = () => {

                if (obs.lat !== 0 || obs.lng !== 0) {

                }
                if (obs.pitLat !== 0 || obs.pitLng !== 0) {
                    wpts += `<wpt lat="${obs.pitLat}" lon="${obs.pitLng}"><name>${(obs.locationName || 'Snow Pit') + ' (Pit Site)'}</name><ele>${obs.pitElevation || obs.elevation || '0'}</ele></wpt>`;
                }
                if (!wpts) {
                    wpts = `<wpt lat="0" lon="0"><name>${obs.locationName || 'SnowSlate Waypoint'}</name><ele>0</ele></wpt>`;
                }
                const gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1">${wpts}</gpx>`;
                const blob = new Blob([gpx], { type: 'application/gpx+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); 
                a.href = url; 
                a.download = `${(obs.locationName || 'SnowSlate_Waypoint').replace(/\s+/g, '_')}.gpx`; 
                a.click();

            const exportLogbookJSON = () => {
                const jsonStr = JSON.stringify(savedLogbook, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `SnowSlate_Logbook_Backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            };

            // Logbook Search & Grouping Logic
            const filteredLogbook = useMemo(() => {
                return savedLogbook.filter(item => {
                    const matchesSearch = 
                        (item.locationName || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (item.observerName || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (item.generalNotes || '').toLowerCase().includes(searchQuery.toLowerCase());

                    if (!matchesSearch) return false;
                    if (filterTag === 'avalanches') return item.instability?.recentAvalanches && item.instability.avalanches?.length > 0;
                    if (filterTag === 'cracking') return item.instability?.cracking;
                    if (filterTag === 'collapsing') return item.instability?.collapsing;
                    if (filterTag === 'wind') return item.instability?.windLoading;
                    return true;
                });
            }, [savedLogbook, searchQuery, filterTag]);

            const groupedLogbook = useMemo(() => {
                const groups = {};
                filteredLogbook.forEach(item => {
                    let key = 'Unassigned';
                    if (groupBy === 'date') {
                        key = item.createdAt ? new Date(item.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'Unknown Date';
                    } else if (groupBy === 'location') {
                        key = item.locationName ? item.locationName.trim() : 'Unnamed Location';
                    } else if (groupBy === 'observer') {
                        key = item.observerName ? item.observerName.trim() : 'Unknown Observer';
                    } else if (groupBy === 'aspect') {
                        key = item.aspect ? `Aspect: ${item.aspect}` : 'Aspect: Unspecified';
                    }
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(item);
                });
                return groups;
            }, [filteredLogbook, groupBy]);

            const maxBottomDepth = obs.layers.length > 0 ? Math.max(...obs.layers.map(l => Number(l.bottomDepth) || 0)) : 100;
            const enteredHs = Number(obs.totalSnowDepth) || 0;
            const totalDepth = Math.max(100, enteredHs, Math.ceil(maxBottomDepth / 25) * 25);

            const svgHeight = 220;
            const svgWidth = 320;
            const topPadding = 22;
            const bottomPadding = 25;
            const leftPadding = 45;
            const rightPadding = 20;
            const plotHeight = svgHeight - topPadding - bottomPadding;
            const plotWidth = svgWidth - leftPadding - rightPadding;
            const colWidth = plotWidth / 6;

            const getY = (depth) => (topPadding + plotHeight) - (depth / totalDepth) * plotHeight;
            const getHardnessX = (h) => {
                const idx = hardnessLevels.indexOf(h);
                return leftPadding + (idx === -1 ? 1 : idx + 1) * colWidth;
            };

            const getTempX = (tVal) => {
                const num = parseFloat(tVal) || 0;
                const clamped = Math.max(-15, Math.min(0, num));
                return leftPadding + ((clamped - (-15)) / 15) * plotWidth;

                                                            <div className="w-1/3">
                                                                <label className="text-[10px] font-bold block mb-1">Depth (cm)</label>
                                                                <input type="number" value={pst.depth} onChange={e => handlePstChange(pst.id, 'depth', Number(e.target.value))} className={`w-full rounded p-1.5 text-xs ${inputBgClass}`} />
                                                            </div>
                                                            <div className="w-2/3">
                                                                <label className="text-[10px] font-bold block mb-1">PST Result</label>
                                                                <input type="text" value={pst.result} onChange={e => handlePstChange(pst.id, 'result', e.target.value)} placeholder="e.g. PST 35/100 (End)" className={`w-full rounded p-1.5 text-xs ${inputBgClass}`} />
                                                            </div>
                                                            <div className="pt-4">
                                                                <button onClick={() => removePstTest(pst.id)} className="bg-red-500/20 text-red-500 p-2 rounded text-xs font-bold">🗑️</button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'export' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div className={`${cardBgClass} p-6 rounded-xl text-center space-y-4`}>
                                    <h2 className="text-sm font-bold uppercase text-cyan-400">CalTopo & Gaia GPX Export</h2>
                                    <p className="text-xs">Generate GPX exports containing both general and pit coordinates for navigation apps.</p>
                                    <button onClick={exportGPX} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-2.5 rounded-lg text-xs w-full">Download GPX File</button>
                                </div>
                                <div className={`${cardBgClass} p-6 rounded-xl text-center space-y-4`}>
                                    <h2 className="text-sm font-bold uppercase text-cyan-400">CAAML v5.0 XML Schema Exporter</h2>
                                    <p className="text-xs">Export snow pit profile into XML format for avalanche centers.</p>
                                    <button onClick={exportCAAML} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-2.5 rounded-lg text-xs w-full">Export CAAML XML</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'logbook' && (
                            <div className="space-y-4">
                                <div className={`${cardBgClass} p-3.5 sm:p-4 rounded-xl space-y-3.5`}>
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                        <div>
                                            <h2 className={headerAccentClass}>📖 Saved Observation Logbook</h2>
                                            <p className="text-[11px] text-slate-400 mt-0.5">Search, group, and manage your field observations.</p>
                                        </div>
                                        <button onClick={exportLogbookJSON} className="bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 text-xs px-3 py-1.5 rounded font-bold transition flex items-center gap-1.5">
                                            📥 Backup / Export Database
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-2">
                                        <div>
                                            <label className="text-[10px] font-bold uppercase block mb-1">Search Observations</label>
                                            <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Search by location, observer..." className={`w-full rounded-lg p-2 text-xs focus:outline-none ${inputBgClass}`} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold uppercase block mb-1">Group Logs By</label>
                                            <select value={groupBy} onChange={e => setGroupBy(e.target.value)} className={`w-full rounded-lg p-2 text-xs focus:outline-none ${inputBgClass}`}>
                                                <option value="date">Date Recorded</option>
                                                <option value="location">Location / Drainage</option>
                                                <option value="observer">Observer Name</option>
                                                <option value="aspect">Aspect</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold uppercase block mb-1">Instability Filter</label>
                                            <select value={filterTag} onChange={e => setFilterTag(e.target.value)} className={`w-full rounded-lg p-2 text-xs focus:outline-none ${inputBgClass}`}>
                                                <option value="all">All Logs</option>
                                                <option value="avalanches">⚠️ Recent Avalanches</option>
                                                <option value="cracking">⚡ Snowpack Cracking</option>
                                                <option value="collapsing">💥 Collapsing / Whumpfs</option>
                                                <option value="wind">💨 Wind Loading</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                {Object.keys(groupedLogbook).length === 0 ? (
                                    <div className={`p-8 rounded-xl text-center text-xs italic font-medium ${subBoxBgClass}`}>
                                        No observation logs matched your search/filter criteria.
                                    </div>
                                ) : (
                                    Object.entries(groupedLogbook).map(([groupTitle, logs]) => (
                                        <div key={groupTitle} className="space-y-2">
                                            <div className="flex items-center gap-2 px-1">
                                                <span className="text-xs font-black uppercase text-cyan-400">{groupTitle}</span>
                                                <span className="text-[10px] bg-slate-800 text-slate-300 font-mono px-2 py-0.5 rounded-full border border-slate-700">{logs.length}</span>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {logs.map(item => (
                                                    <div key={item.id} className={`p-3.5 rounded-xl text-xs space-y-2.5 transition border hover:border-cyan-500/50 ${subBoxBgClass}`}>
                                                        <div className="flex justify-between items-start font-bold border-b border-[#3A506B] pb-2">
                                                            <div>
                                                                <h3 className="text-sm font-extrabold text-cyan-300">{item.locationName || 'Untitled Location'}</h3>
                                                                <p className="text-[10px] text-slate-400 font-normal">
                                                                    {item.createdAt ? new Date(item.createdAt).toLocaleString() : 'No timestamp'}
                                                                </p>
                                                            </div>
                                                            <div className="text-right font-mono text-[11px]">
                                                                <span className="text-amber-400">{item.pitElevation || item.elevation || '0'}ft</span>
                                                                <span className="ml-1 text-slate-300">({item.aspect})</span>
                                                            </div>
                                                        </div>

                                                        <div className="grid grid-cols-2 gap-2 text-[11px] font-mono text-slate-300">
                                                            <div>Observer: <span className="text-white font-bold">{item.observerName || 'N/A'}</span></div>
                                                            <div>Snow Depth (HS): <span className="text-white font-bold">{item.totalSnowDepth || 'N/A'}cm</span></div>
                                                            <div>Layers Logged: <span className="text-white font-bold">{item.layers ? item.layers.length : 0}</span></div>
                                                            <div>Pit Slope: <span className="text-white font-bold">{item.pitSlopeAngle || item.slopeAngle || '0'}°</span></div>
                                                        </div>

                                                        {item.instability && (
                                                            <div className="flex flex-wrap gap-1 pt-1">
                                                                {item.instability.recentAvalanches && <span className="text-[9px] bg-red-950 text-red-300 px-1.5 py-0.5 rounded border border-red-800 font-bold">⚠️ Avalanches</span>}
                                                                {item.instability.cracking && <span className="text-[9px] bg-amber-950 text-amber-300 px-1.5 py-0.5 rounded border border-amber-800 font-bold">⚡ Cracking</span>}
                                                                {item.instability.collapsing && <span className="text-[9px] bg-amber-950 text-amber-300 px-1.5 py-0.5 rounded border border-amber-800 font-bold">💥 Collapsing</span>}
                                                                {item.instability.windLoading && <span className="text-[9px] bg-cyan-950 text-cyan-300 px-1.5 py-0.5 rounded border border-cyan-800 font-bold">💨 Wind Loading</span>}
                                                            </div>
                                                        )}

                                                        <div className="flex justify-between items-center border-t border-[#3A506B] pt-2">
                                                            <button onClick={() => setSelectedReportModal(item)} className="text-[11px] text-cyan-400 hover:underline font-bold flex items-center gap-1">
                                                                <span>🔍 View Full Report</span>
                                                            </button>
                                                            <div className="flex items-center gap-2">
                                                                <button onClick={() => loadRecordToActiveSession(item)} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-2.5 py-1 rounded text-[10px] font-bold transition">
                                                                    📂 Load to Edit
                                                                </button>
                                                                <button onClick={() => deleteRecord(item.id)} className="text-red-400 hover:text-red-300 text-[11px] font-bold px-1" title="Delete record">
                                                                    🗑️
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))
                                )}

                                {selectedReportModal && (
                                    <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4">
                                        <div className={`max-w-3xl w-full max-h-[90vh] overflow-y-auto rounded-xl p-4 sm:p-6 space-y-4 ${cardBgClass}`}>
                                            <div className="flex justify-between items-start border-b border-[#3A506B] pb-3">
                                                <div>
                                                    <h2 className="text-lg font-bold text-cyan-400">{selectedReportModal.locationName || 'Untitled Location'}</h2>
                                                    <p className="text-xs text-slate-400">
                                                        Recorded: {selectedReportModal.createdAt ? new Date(selectedReportModal.createdAt).toLocaleString() : 'N/A'}
                                                    </p>
                                                </div>
                                                <button onClick={() => setSelectedReportModal(null)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                                            </div>

                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs font-mono p-3 rounded-lg bg-[#0B132B] border border-[#3A506B]">
                                                <div>Observer: <b>{selectedReportModal.observerName || 'N/A'}</b></div>
                                                <div>Pit Elev: <b>{selectedReportModal.pitElevation || selectedReportModal.elevation || '0'} ft</b></div>
                                                <div>Aspect: <b>{selectedReportModal.aspect}</b></div>
                                                <div>Pit Slope: <b>{selectedReportModal.pitSlopeAngle || selectedReportModal.slopeAngle || '0'}°</b></div>
                                                <div>HS: <b>{selectedReportModal.totalSnowDepth || 'N/A'} cm</b></div>
                                                <div>Air Temp: <b>{selectedReportModal.weather?.airTemp || 'N/A'}°F</b></div>
                                                <div>Sky: <b>{selectedReportModal.weather?.skyCover}</b></div>
                                                <div>Wind: <b>{selectedReportModal.weather?.windSpeed}</b></div>
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs font-mono p-3 rounded-lg bg-[#0B132B] border border-[#3A506B]">
                                                <div>General GPS: <b>{selectedReportModal.lat !== 0 ? '✓ Recorded' : 'Not Set'}</b></div>
                                                <div>Pit GPS: <b>{selectedReportModal.pitLat && selectedReportModal.pitLat !== 0 ? '✓ Recorded' : 'Not Set'}</b></div>
                                            </div>

                                            {selectedReportModal.layers && selectedReportModal.layers.length > 0 && (
                                                <div className="space-y-2">
                                                    <h3 className="text-xs font-bold uppercase text-cyan-400">Pit Stratigraphy Layers</h3>
                                                    <div className="space-y-1">
                                                        {selectedReportModal.layers.map((l, i) => (
                                                            <div key={i} className="flex justify-between text-xs font-mono p-2 rounded bg-[#0B132B] border border-[#3A506B]">
                                                                <span>Depth: {l.topDepth}-{l.bottomDepth}cm</span>
                                                                <span>Hardness: <b>{l.hardness}</b></span>
                                                                <span>Grain: <b>{l.grainType || '—'}</b> ({l.grainSize}mm)</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}

                                            {selectedReportModal.instability?.avalanches && selectedReportModal.instability.avalanches.length > 0 && (
                                                <div className="space-y-2">
                                                    <h3 className="text-xs font-bold uppercase text-red-400">Avalanches Recorded ({selectedReportModal.instability.avalanches.length})</h3>
                                                    {selectedReportModal.instability.avalanches.map((av, avIdx) => (
                                                        <div key={avIdx} className="text-xs font-mono p-2.5 rounded bg-[#0B132B] border border-red-900/50 space-y-1">
                                                            <div className="font-bold text-red-300">Avalanche #{avIdx+1}: {av.size} / {av.rScale} ({av.problemType || 'Unspecified'})</div>
                                                            <div>Trigger: {av.trigger} | Elev: {av.elevation}ft ({av.aspect}) | Timeframe: {av.timeFrame}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {selectedReportModal.snowTemps && selectedReportModal.snowTemps.length > 0 && (
                                                <div className="space-y-1">
                                                    <h3 className="text-xs font-bold uppercase text-amber-400">Snow Temperature Profile</h3>
                                                    <div className="text-xs font-mono p-2 rounded bg-[#0B132B] border border-[#3A506B]">
                                                        {selectedReportModal.snowTemps.map(t => `${t.depth}cm: ${t.temp}°C`).join(' | ')}
                                                    </div>
                                                </div>
                                            )}

                                            {selectedReportModal.pstTests && selectedReportModal.pstTests.length > 0 && (
                                                <div className="space-y-1">
                                                    <h3 className="text-xs font-bold uppercase text-cyan-400">Propagation Saw Tests (PST)</h3>
                                                    <div className="text-xs font-mono p-2 rounded bg-[#0B132B] border border-[#3A506B]">
                                                        {selectedReportModal.pstTests.map(p => `${p.depth}cm: ${p.result}`).join(' | ')}
                                                    </div>
                                                </div>
                                            )}

                                            <div className="flex justify-between items-center border-t border-[#3A506B] pt-4">
                                                <button onClick={() => deleteRecord(selectedReportModal.id)} className="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded font-bold">
                                                    Delete Observation
                                                </button>
                                                <button onClick={() => loadRecordToActiveSession(selectedReportModal)} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs px-4 py-1.5 rounded font-bold">
                                                    Load into Workspace
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>

                    <footer className={`px-3 py-2.5 flex justify-between items-center text-xs solar-header ${isBright ? 'bg-[#0F172A] text-white border-t-2 border-black' : 'bg-[#0B132B] border-t border-[#3A506B]'}`}>
                        <span className="font-mono text-[11px] text-cyan-300 font-bold">
                            Gen GPS: {obs.lat !== 0 || obs.lng !== 0 ? 'Recorded' : 'Not Set'} | Pit GPS: {obs.pitLat && obs.pitLat !== 0 ? 'Recorded' : 'Not Set'}
                        </span>
                        <span className="italic text-[11px] font-bold text-slate-300">SnowSlate Suite v1.14</span>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
