            darkMode: 'class',
            theme: {

                            800: '#3A506B',

                        cyan: {

                            500: '#0EA5E9',
                            600: '#0284C7'

                        amber: {

    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3A506B; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4A6183; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* High-Contrast Solar Mode Overrides */
        body.solar-mode {
            background-color: #FFFFFF !important;
            color: #000000 !important;
        }
        body.solar-mode .solar-card {
            background-color: #F1F5F9 !important;
            border-color: #000000 !important;
            color: #000000 !important;
        }
        body.solar-mode input, body.solar-mode select, body.solar-mode textarea {
            background-color: #FFFFFF !important;
            color: #000000 !important;
            border-color: #000000 !important;

        }
        body.solar-mode .solar-header {
            background-color: #0F172A !important;
            color: #FFFFFF !important;
        }
        body.solar-mode .solar-btn-active {
            background-color: #000000 !important;
            color: #FFFFFF !important;
            border-color: #000000 !important;
        }
        body.solar-mode .solar-accent-text {
            color: #0284C7 !important;
            font-weight: 800 !important;
        }
        body.solar-mode .solar-accent-bg {
            background-color: #0284C7 !important;
            color: #FFFFFF !important;
        }
        body.solar-mode .solar-border {
            border-color: #000000 !important;
        }
        body.solar-mode svg {
            background-color: #FFFFFF !important;
            border-color: #000000 !important;

</head>
<body class="bg-[#0B132B] text-slate-100 min-h-screen font-sans p-1 sm:p-6 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('gen_obs');
            const [colorPalette, setColorPalette] = useState('dim');
            
            const [obs, setObs] = useState({
                locationName: '',
                observerName: '',
                elevation: '',
                aspect: 'N',
                slopeAngle: '',
                lat: 0,
                lng: 0,
                totalSnowDepth: '',
                generalNotes: '',
                photos: [],
                weather: {
                    skyCover: 'CLR',
                    airTemp: '',
                    windSpeed: 'Calm'
                },
                instability: {
                    recentAvalanches: false,
                    avalanches: [],
                    cracking: false,
                    crackingExtent: 'Isolated',
                    collapsing: false,
                    collapsingExtent: 'Isolated',
                    windLoading: false,
                    windLoadingRate: 'Light',
                    windLoadingDirection: 'N',
                    snowAvailableForTransport: 'Moderate',
                    showAllParameters: true
                },
                layers: [],
                pstTests: [],
                snowTemps: []
            });
            const [savedLogbook, setSavedLogbook] = useState([]);
            const [statusMsg, setStatusMsg] = useState('');
            const [isRecording, setIsRecording] = useState(false);
            const [isFetchingGps, setIsFetchingGps] = useState(false);
            const [showPstSection, setShowPstSection] = useState(false);
            const [showTempSection, setShowTempSection] = useState(false);

            useEffect(() => {
                if (colorPalette === 'bright') {
                    document.body.classList.add('solar-mode');
                } else {
                    document.body.classList.remove('solar-mode');
                }
            }, [colorPalette]);

            const hardnessLevels = ['F', '4F', '1F', 'P', 'K', 'I'];
            const hardnessMap = { 'F': 1, '4F': 2, '1F': 3, 'P': 4, 'K': 5, 'I': 6 };

            const grainTypesList = [
                { code: 'PP', name: 'New Snow', symbol: '+' },
                { code: 'PPgp', name: 'Graupel', symbol: '✼' },
                { code: 'DF', name: 'Decomposing Particles', symbol: '/' },
                { code: 'RG', name: 'Rounds', symbol: '●' },
                { code: 'RGxf', name: 'Rounds to Facets', symbol: '▅' },
                { code: 'FC', name: 'Facets', symbol: '□' },
                { code: 'FCsf', name: 'Near Surface Facets', symbol: '▨' },
                { code: 'SH', name: 'Surface Hoar', symbol: 'V' },
                { code: 'DH', name: 'Depth Hoar', symbol: '∧' },
                { code: 'FCxr', name: 'Facets to Rounds', symbol: '∩' },
                { code: 'MF', name: 'Melt Forms', symbol: '○' },
                { code: 'MFcr', name: 'Melt Freeze Crust', symbol: '∞' }
            ];

            const togglePalette = () => {
                const next = colorPalette === 'dim' ? 'bright' : 'dim';
                setColorPalette(next);
                setStatusMsg(next === 'bright' ? 'High-Contrast Bright Day Mode' : 'Dim Day / Headlamp Mode');
                setTimeout(() => setStatusMsg(''), 2500);
            };

            const fetchGpsLocation = () => {
                if (!navigator.geolocation) {
                    alert('Geolocation is not supported by your browser.');
                    return;
                }
                setIsFetchingGps(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude, altitude } = position.coords;
                        const hasAltitude = altitude !== null && altitude !== undefined && !isNaN(altitude);
                        const elevationFeet = hasAltitude ? Math.round(altitude * 3.28084).toString() : obs.elevation;

                        setObs(prev => ({
                            ...prev,
                            lat: latitude,
                            lng: longitude,
                            elevation: elevationFeet
                        }));
                        setIsFetchingGps(false);
                        
                        if (hasAltitude) {
                            setStatusMsg('GPS & Elevation acquired!');
                        } else {
                            setStatusMsg('GPS acquired (Elevation sensor unavailable)');
                        }
                        setTimeout(() => setStatusMsg(''), 4000);
                    },
                    (error) => {
                        setIsFetchingGps(false);
                        alert(`Unable to retrieve GPS location: ${error.message}`);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const recordAvalancheGps = (avalancheId) => {
                if (!navigator.geolocation) {
                    alert('Geolocation is not supported by your browser.');
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        setObs(prev => ({
                            ...prev,
                            instability: {
                                ...prev.instability,
                                avalanches: prev.instability.avalanches.map(a => 
                                    a.id === avalancheId ? { ...a, lat: latitude, lng: longitude } : a
                                )
                            }
                        }));
                        setStatusMsg('Avalanche GPS recorded!');
                        setTimeout(() => setStatusMsg(''), 3000);
                    },
                    (error) => {
                        alert(`Unable to retrieve GPS location: ${error.message}`);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const addAvalanche = () => {
                setObs(prev => ({
                    ...prev,
                    instability: {
                        ...prev.instability,
                        avalanches: [
                            ...(prev.instability.avalanches || []),
                            {
                                id: Date.now().toString(),
                                elevation: prev.elevation || '',
                                aspect: prev.aspect || 'N',
                                timeFrame: 'Today',
                                trigger: 'N',
                                problemType: '',
                                size: 'D2',
                                rScale: 'R1',
                                lat: 0,
                                lng: 0
                            }
                        ]
                    }
                }));
            };

            const removeAvalanche = (id) => {
                setObs(prev => ({
                    ...prev,
                    instability: {
                        ...prev.instability,
                        avalanches: prev.instability.avalanches.filter(a => a.id !== id)
                    }
                }));
            };

            const handleAvalancheChange = (id, field, value) => {
                setObs(prev => ({
                    ...prev,
                    instability: {
                        ...prev.instability,
                        avalanches: prev.instability.avalanches.map(a => a.id === id ? { ...a, [field]: value } : a)
                    }
                }));
            };

            const handlePhotoUpload = (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                const newPhotos = files.map(file => ({
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    name: file.name,
                    url: URL.createObjectURL(file)
                }));
                setObs(prev => ({
                    ...prev,
                    photos: [...(prev.photos || []), ...newPhotos]
                }));
                e.target.value = null;
            };

            const removePhoto = (photoId) => {
                setObs(prev => ({
                    ...prev,
                    photos: prev.photos.filter(p => p.id !== photoId)
                }));
            };

            const startVoiceDictation = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Speech recognition is not supported in this browser. You can use your mobile keyboard's built-in microphone button or type directly.");
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onstart = () => setIsRecording(true);
                recognition.onend = () => setIsRecording(false);
                recognition.onerror = () => setIsRecording(false);
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    setObs(prev => ({
                        ...prev,
                        generalNotes: prev.generalNotes ? prev.generalNotes + ' ' + transcript : transcript
                    }));
                };
                recognition.start();
            };

            const handleLayerChange = (id, field, value) => {
                setObs(prev => ({
                    ...prev,
                    layers: prev.layers.map(l => l.id === id ? { ...l, [field]: value } : l)
                }));
            };

            const addLayer = () => {
                const last = obs.layers[obs.layers.length - 1];
                const top = last ? Number(last.bottomDepth) : 0;
                setObs(prev => ({
                    ...prev,
                    layers: [...prev.layers, { id: Date.now().toString(), topDepth: top, bottomDepth: top + 20, hardness: 'F', grainType: '', grainSize: '1.0', stabilityTest: '' }]
                }));
            };

            const removeLayer = (id) => {
                setObs(prev => ({ ...prev, layers: prev.layers.filter(l => l.id !== id) }));
            };

            const addPstTest = () => {
                setObs(prev => ({
                    ...prev,
                    pstTests: [...prev.pstTests, { id: Date.now().toString(), depth: 40, result: 'PST 30/100 (End)' }]
                }));
            };

            const handlePstChange = (id, field, value) => {
                setObs(prev => ({
                    ...prev,
                    pstTests: prev.pstTests.map(p => p.id === id ? { ...p, [field]: value } : p)
                }));
            };

            const removePstTest = (id) => {
                setObs(prev => ({ ...prev, pstTests: prev.pstTests.filter(p => p.id !== id) }));
            };

            const addTempPoint = () => {
                const last = obs.snowTemps[obs.snowTemps.length - 1];
                const nextDepth = last ? Number(last.depth) + 10 : 10;
                setObs(prev => ({
                    ...prev,
                    snowTemps: [...prev.snowTemps, { id: Date.now().toString(), depth: nextDepth, temp: '-2.0' }]
                }));
            };

            const handleTempChange = (id, field, value) => {
                setObs(prev => ({
                    ...prev,
                    snowTemps: prev.snowTemps.map(t => t.id === id ? { ...t, [field]: value } : t)
                }));
            };

            const removeTempPoint = (id) => {
                setObs(prev => ({ ...prev, snowTemps: prev.snowTemps.filter(t => t.id !== id) }));
            };

            const saveRecord = () => {
                setSavedLogbook(prev => [obs, ...prev]);
                setStatusMsg('Record saved to SnowSlate logbook!');
                setTimeout(() => setStatusMsg(''), 3000);
            };

            const exportCAAML = () => {
                const xml = `<?xml version="1.0" encoding="UTF-8"?><caaml:SnowProfile xmlns:caaml="http://caaml.org/Schemas/V5.0/Profile"><caaml:obsDateTime>${new Date().toISOString()}</caaml:obsDateTime><caaml:locName>${obs.locationName}</caaml:locName></caaml:SnowProfile>`;
                const blob = new Blob([xml], { type: 'application/xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${(obs.locationName || 'SnowSlate_Pit').replace(/\s+/g, '_')}_CAAML.xml`;
                a.click();
            };

            const exportGPX = () => {
                const gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1"><wpt lat="${obs.lat}" lon="${obs.lng}"><name>${obs.locationName || 'SnowSlate Waypoint'}</name><ele>${obs.elevation || '0'}</ele></wpt></gpx>`;
                const blob = new Blob([gpx], { type: 'application/gpx+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); 
                a.href = url; 
                a.download = `${(obs.locationName || 'SnowSlate_Waypoint').replace(/\s+/g, '_')}.gpx`; 
                a.click();
            };

            const maxBottomDepth = obs.layers.length > 0 ? Math.max(...obs.layers.map(l => Number(l.bottomDepth) || 0)) : 100;
            const enteredHs = Number(obs.totalSnowDepth) || 0;
            const totalDepth = Math.max(100, enteredHs, Math.ceil(maxBottomDepth / 25) * 25);

            const svgHeight = 220;
            const svgWidth = 320;
            const topPadding = 22;
            const bottomPadding = 25;
            const leftPadding = 45;
            const rightPadding = 20;
            const plotHeight = svgHeight - topPadding - bottomPadding;
            const plotWidth = svgWidth - leftPadding - rightPadding;
            const colWidth = plotWidth / 6;

            const getY = (depth) => (topPadding + plotHeight) - (depth / totalDepth) * plotHeight;
            
            const getHardnessX = (h) => {
                const idx = hardnessLevels.indexOf(h);
                if (idx === -1) return leftPadding + colWidth;
                return leftPadding + (idx + 1) * colWidth;
            };

            const getTempX = (tVal) => {
                const num = parseFloat(tVal) || 0;
                const clamped = Math.max(-15, Math.min(0, num));
                return leftPadding + ((clamped - (-15)) / 15) * plotWidth;
            };

            const depthStep = totalDepth > 150 ? 50 : 25;
            const depthTicks = [];
            for (let d = 0; d <= totalDepth; d += depthStep) {
                depthTicks.push(d);
            }

            const isBright = colorPalette === 'bright';
            const cardBgClass = isBright ? 'bg-white border-2 border-black text-black solar-card' : 'bg-[#1C2541] border border-[#3A506B] text-slate-100';
            const inputBgClass = isBright ? 'bg-white text-black border-2 border-black font-bold' : 'bg-[#0B132B] text-slate-100 border border-[#3A506B] focus:border-cyan-400';
            const subBoxBgClass = isBright ? 'bg-slate-100 border-2 border-black' : 'bg-[#0B132B] border border-[#3A506B]';
            const headerAccentClass = isBright ? 'text-black font-black uppercase tracking-wider' : 'text-cyan-400 font-bold uppercase tracking-wider';

            return (
                <div className={`max-w-6xl mx-auto rounded-xl shadow-2xl flex flex-col overflow-hidden transition-colors duration-200 ${isBright ? 'bg-white text-black border-2 border-black' : 'bg-[#0B132B] border border-[#3A506B]'}`}>
                    <header className={`px-3 py-2.5 flex flex-col lg:flex-row justify-between items-center gap-3 solar-header ${isBright ? 'bg-[#0F172A] text-white border-b-2 border-black' : 'bg-[#0B132B] border-b border-[#3A506B]'}`}>
                        <div className="flex items-center justify-between w-full lg:w-auto gap-3">
                            <div className="flex items-center gap-2.5">
                                <div className="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-400 flex items-center justify-center shadow-inner overflow-hidden shrink-0">
                                    <svg className="w-6 h-6 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                        <rect x="4" y="3" width="16" height="18" rx="2" strokeWidth="2"/>
                                        <line x1="8" y1="7" x2="8" y2="7.01"/>
                                        <line x1="8" y1="11" x2="8" y2="11.01"/>
                                        <path d="M12 9l2 2m0-2l-2 2m2-5v6m-3-3h6"/>
                                    </svg>
                                </div>
                                <div>
                                    <h1 className="text-sm font-extrabold tracking-tight leading-none text-white">SnowSlate</h1>
                                    <p className="text-[9px] tracking-widest text-cyan-400 font-bold uppercase mt-0.5">Field Notebook Suite</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2 lg:hidden">
                                <button 
                                    onClick={togglePalette}
                                    className={`px-2.5 py-1 rounded text-xs font-bold transition flex items-center gap-1 border ${isBright ? 'bg-amber-400 text-black border-black' : 'bg-slate-800 text-amber-300 border-amber-400/50'}`}
                                >
                                    {isBright ? '☀️ Bright Sun' : '☁️ Dim / Night'}
                                </button>
                                {statusMsg && <span className="text-[10px] bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded border border-cyan-700">{statusMsg}</span>}
                                <button onClick={saveRecord} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3 py-1 rounded text-xs shadow transition">
                                    💾 Save
                                </button>
                            </div>
                        </div>

                        <nav className={`flex items-center gap-1 p-1 rounded-lg text-xs font-semibold overflow-x-auto w-full lg:w-auto hide-scrollbar ${isBright ? 'bg-slate-800 border border-slate-700' : 'bg-[#1C2541] border border-[#3A506B]'}`}>
                            {[
                                { id: 'gen_obs', label: 'General Obs', icon: '📝' },
                                { id: 'pit_profile', label: 'Pit Profile', icon: '🏔️' },
                                { id: 'export', label: 'GIS & CAAML Export', icon: '📦' },
                                { id: 'logbook', label: `Logbook (${savedLogbook.length})`, icon: '📖' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`py-1 px-2.5 rounded whitespace-nowrap transition flex items-center gap-1 shrink-0 ${activeTab === tab.id ? 'text-cyan-400 bg-[#0B132B] border border-cyan-500/50 shadow solar-btn-active' : 'text-slate-300 hover:text-white'}`}
                                >
                                    <span>{tab.icon}</span>
                                    <span>{tab.label}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="hidden lg:flex items-center gap-3 shrink-0">
                            <button 
                                onClick={togglePalette}
                                className={`px-3 py-1 rounded text-xs font-bold transition flex items-center gap-1.5 border shadow ${isBright ? 'bg-amber-400 hover:bg-amber-300 text-black border-black' : 'bg-[#1C2541] hover:bg-slate-800 text-amber-300 border-amber-400/40'}`}
                            >
                                <span>{isBright ? '☀️ High-Contrast Sun Mode' : '☁️ Dim / Headlamp Mode'}</span>
                            </button>
                            {statusMsg && <span className="text-xs bg-cyan-950 text-cyan-300 px-2.5 py-1 rounded border border-cyan-700">{statusMsg}</span>}
                            <button onClick={saveRecord} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-1.5 rounded text-xs flex items-center gap-1.5 shadow transition">

                                        <svg className={`w-full sm:w-2/3 h-full rounded border relative ${isBright ? 'bg-white border-black' : 'bg-[#0B132B] border-[#3A506B]'}`} viewBox={`0 0 ${svgWidth} ${svgHeight}`} preserveAspectRatio="none">
                                            {hardnessLevels.map((h, i) => {
                                                const x = leftPadding + (i + 1) * colWidth;
                                                return (
                                                    <g key={h}>
                                                        <line x1={x} y1={topPadding} x2={x} y2={topPadding + plotHeight} stroke={isBright ? "#94a3b8" : "#3A506B"} strokeDasharray="2 2" strokeWidth="1" />
                                                        <text x={x} y={topPadding - 6} fill={isBright ? "#000000" : "#94a3b8"} fontSize="9" textAnchor="middle" fontFamily="monospace" fontWeight="bold">{h}</text>
                                                    </g>
                                                );
                                            })}

                                            {depthTicks.map(d => {
                                                const y = getY(d);
                                                return (
                                                    <g key={d}>
                                                        <line x1={leftPadding - 4} y1={y} x2={leftPadding + plotWidth} y2={y} stroke={isBright ? "#cbd5e1" : "#3A506B"} strokeWidth="0.5" />
                                                        <text x={leftPadding - 8} y={y + 3} fill={isBright ? "#000000" : "#94a3b8"} fontSize="8" textAnchor="end" fontFamily="monospace" fontWeight="bold">{d}cm</text>
                                                    </g>
                                                );
                                            })}

                                            {obs.layers.length === 0 && (
                                                <text x={leftPadding + plotWidth / 2} y={topPadding + plotHeight / 2} fill={isBright ? "#64748b" : "#475569"} fontSize="11" textAnchor="middle" fontStyle="italic">
                                                    No layers logged yet. Click "+ Add Layer" below.
                                                </text>
                                            )}

                                            {obs.layers.map((l) => {
                                                const tDepth = Number(l.topDepth) || 0;
                                                const bDepth = Number(l.bottomDepth) || tDepth + 10;
                                                const yTopPixel = getY(tDepth);
                                                const yBotPixel = getY(bDepth);
                                                const rightX = getHardnessX(l.hardness);
                                                const layerHeight = Math.max(Math.abs(yTopPixel - yBotPixel), 4);
                                                const startY = Math.min(yTopPixel, yBotPixel);

                                                return (
                                                    <g key={l.id}>
                                                        <rect 
                                                            x={leftPadding} 
                                                            y={startY} 
                                                            width={rightX - leftPadding} 
                                                            height={layerHeight} 
                                                            fill={isBright ? "#0284C7" : "#0369a1"} 
                                                            opacity="0.8" 
                                                            stroke={isBright ? "#000000" : "#38bdf8"} 
                                                            strokeWidth="1" 
                                                        />
                                                        <text x={leftPadding + 6} y={startY + Math.min(14, layerHeight - 4)} fill="#FFFFFF" fontSize="9" fontWeight="bold" fontFamily="sans-serif">
                                                            {l.hardness} {l.grainType ? `(${l.grainType})` : ''}
                                                        </text>
                                                    </g>
                                                );
                                            })}

                                            {obs.snowTemps.length > 0 && (() => {
                                                const sortedTemps = [...obs.snowTemps].sort((a, b) => Number(a.depth) - Number(b.depth));
                                                const pointsStr = sortedTemps.map(t => `${getTempX(t.temp)},${getY(t.depth)}`).join(' ');
                                                return (
                                                    <g>
                                                        {sortedTemps.length > 1 && (
                                                            <polyline points={pointsStr} fill="none" stroke="#D97706" strokeWidth="2.5" strokeDasharray="3 3" />
                                                        )}
                                                        {sortedTemps.map(t => {
                                                            const cx = getTempX(t.temp);
                                                            const cy = getY(t.depth);
                                                            return (
                                                                <g key={t.id}>
                                                                    <circle cx={cx} cy={cy} r="3.5" fill="#F59E0B" stroke="#000000" strokeWidth="1" />
                                                                    <text x={cx + 5} y={cy - 4} fill={isBright ? "#000000" : "#fbbf24"} fontSize="8" fontFamily="monospace" fontWeight="bold">{t.temp}°C</text>
                                                                </g>
                                                            );
                                                        })}
                                                    </g>
                                                );
                                            })()}

                                            {obs.pstTests.map(pst => {
                                                const yPos = getY(pst.depth);
                                                return (
                                                    <g key={pst.id}>
                                                        <line x1={leftPadding} y1={yPos} x2={leftPadding + plotWidth} y2={yPos} stroke="#0EA5E9" strokeWidth="2" strokeDasharray="4 2" />
                                                        <rect x={leftPadding + plotWidth - 95} y={yPos - 9} width="95" height="14" fill={isBright ? "#FFFFFF" : "#0f172a"} opacity="0.9" rx="3" stroke="#0EA5E9" strokeWidth="1" />
                                                        <text x={leftPadding + plotWidth - 5} y={yPos + 1} fill={isBright ? "#000000" : "#38bdf8"} fontSize="8" fontFamily="monospace" fontWeight="bold" textAnchor="end">{pst.result || 'PST Test'}</text>
                                                    </g>
                                                );
                                            })}
                                        </svg>

                                        <div className="w-full sm:w-1/3 space-y-1.5 text-xs overflow-y-auto max-h-full">
                                            {obs.layers.length === 0 ? (
                                                <div className="text-[11px] text-slate-400 italic text-center py-8 font-semibold">
                                                    Layer summary list will display here
                                                </div>
                                            ) : (
                                                obs.layers.map((l) => (
                                                    <div key={l.id} className={`flex justify-between px-2.5 py-1 rounded font-mono text-[11px] ${subBoxBgClass}`}>
                                                        <span>{l.topDepth}-{l.bottomDepth}cm</span>
                                                        <span className="font-bold text-cyan-400">{l.hardness} / {l.grainType || '—'} {l.stabilityTest ? `[${l.stabilityTest}]` : ''}</span>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className={`${cardBgClass} p-3.5 sm:p-4 rounded-xl space-y-3.5`}>
                                    <div className="flex flex-wrap justify-between items-center gap-3 border-b border-[#3A506B] pb-2.5 solar-border">
                                        <h2 className={headerAccentClass}>Pit Layers</h2>
                                        
                                        <div className="flex items-center gap-3">
                                            <div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg border shadow-inner ${subBoxBgClass}`}>
                                                <label className="text-[10px] font-bold uppercase tracking-wider whitespace-nowrap">Total Depth (HS):</label>
                                                <input 
                                                    type="number" 
                                                    value={obs.totalSnowDepth} 
                                                    onChange={e => setObs({...obs, totalSnowDepth: e.target.value})}
                                                    placeholder="cm"
                                                    className={`w-14 rounded px-1.5 py-0.5 text-xs font-mono font-bold text-center focus:outline-none ${inputBgClass}`}
                                                />
                                                <span className="text-[10px] font-mono font-bold">cm</span>
                                            </div>

                                            <button onClick={addLayer} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs px-3 py-1.5 rounded font-bold shadow transition">
                                                + Add Layer
                                            </button>
                                        </div>
                                    </div>

                                    {obs.layers.length === 0 ? (
                                        <div className={`text-center py-8 rounded-lg border border-dashed text-xs ${subBoxBgClass}`}>
                                            <p className="mb-2 font-semibold">No pit layers recorded yet.</p>
                                            <button onClick={addLayer} className="bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 text-xs px-3 py-1 rounded font-bold transition">
                                                + Add First Layer
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="space-y-2.5">
                                            {obs.layers.map((layer) => (
                                                <div key={layer.id} className={`p-3 rounded-lg grid grid-cols-2 sm:grid-cols-7 gap-2.5 items-center ${subBoxBgClass}`}>
                                                    <div>
                                                        <label className="text-[10px] font-bold block mb-1">Top (cm)</label>
                                                        <input 
                                                            type="number" 
                                                            value={layer.topDepth} 
                                                            onChange={e => handleLayerChange(layer.id, 'topDepth', Number(e.target.value))}
                                                            className={`w-full rounded p-1.5 text-xs ${inputBgClass}`}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-bold block mb-1">Bottom (cm)</label>
                                                        <input 
                                                            type="number" 
                                                            value={layer.bottomDepth} 
                                                            onChange={e => handleLayerChange(layer.id, 'bottomDepth', Number(e.target.value))}
                                                            className={`w-full rounded p-1.5 text-xs ${inputBgClass}`}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-bold block mb-1">Hardness</label>
                                                        <select 
                                                            value={layer.hardness} 
                                                            onChange={e => handleLayerChange(layer.id, 'hardness', e.target.value)}
                                                            className={`w-full rounded p-1.5 text-xs ${inputBgClass}`}
                                                        >
                                                            {hardnessLevels.map(h => <option key={h} value={h}>{h}</option>)}
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-bold block mb-1">Grain (SWAG)</label>
                                                        <select 
                                                            value={layer.grainType} 
                                                            onChange={e => handleLayerChange(layer.id, 'grainType', e.target.value)}
                                                            className={`w-full rounded p-1.5 text-xs font-mono ${inputBgClass}`}
                                                        >
                                                            <option value="">-- Select --</option>
                                                            {grainTypesList.map(g => (
                                                                <option key={g.code} value={g.code}>
                                                                    {g.symbol} {g.code} ({g.name})
                                                                </option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-bold block mb-1">Size (mm)</label>
                                                        <input 
                                                            type="text" 
                                                            value={layer.grainSize} 
                                                            onChange={e => handleLayerChange(layer.id, 'grainSize', e.target.value)}
                                                            className={`w-full rounded p-1.5 text-xs ${inputBgClass}`}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] font-bold block mb-1">CT / ECT Result</label>
                                                        <input 
                                                            type="text" 
                                                            value={layer.stabilityTest || ''} 
                                                            onChange={e => handleLayerChange(layer.id, 'stabilityTest', e.target.value)}
                                                            placeholder="e.g. CTM 14 (Q2)"
                                                            className={`w-full rounded p-1.5 text-xs ${inputBgClass}`}
                                                        />
                                                    </div>
                                                    <div className="flex justify-end pt-3 sm:pt-0">
                                                        <button onClick={() => removeLayer(layer.id)} className="bg-red-500/20 hover:bg-red-500/40 text-red-500 p-2 rounded text-xs transition font-bold">
                                                            🗑️ Delete
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className={`${cardBgClass} p-3.5 sm:p-4 rounded-xl space-y-3.5`}>
                                    <div className="flex justify-between items-center cursor-pointer" onClick={() => setShowTempSection(!showTempSection)}>
                                        <h2 className={headerAccentClass}>
                                            🌡️ Snow Temperature Profile {obs.snowTemps.length > 0 ? `(${obs.snowTemps.length})` : ''}
                                        </h2>
                                        <span className="text-xs font-bold text-cyan-400">{showTempSection ? '▲ Hide Section' : '▼ Show Section'}</span>
                                    </div>

                                    {showTempSection && (
                                        <div className="space-y-3 pt-2 border-t border-[#3A506B] solar-border">
                                            <div className="flex justify-between items-center">
                                                <p className="text-[11px] font-medium">Record snow temperatures at various depths (e.g. -2.5°C at 20cm).</p>
                                                <button onClick={addTempPoint} className={`text-xs px-3 py-1 rounded font-bold transition border ${isBright ? 'bg-black text-white border-black' : 'bg-slate-800 hover:bg-slate-700 text-cyan-400 border-slate-700'}`}>
                                                    + Add Temp Point
                                                </button>
                                            </div>
                                            {obs.snowTemps.length === 0 ? (
                                                <p className="text-xs text-slate-400 italic py-3 text-center font-medium">No temperature points recorded.</p>
                                            ) : (
                                                <div className="space-y-2">
                                                    {obs.snowTemps.map(temp => (
                                                        <div key={temp.id} className={`p-2.5 rounded-lg flex items-center gap-3 ${subBoxBgClass}`}>
                                                            <div className="w-1/3">
                                                                <label className="text-[10px] font-bold block mb-1">Depth (cm)</label>
                                                                <input 
                                                                    type="number" 
                                                                    value={temp.depth} 
                                                                    onChange={e => handleTempChange(temp.id, 'depth', Number(e.target.value))}
                                                                    className={`w-full rounded p-1.5 text-xs ${inputBgClass}`}
                                                                />
                                                            </div>
                                                            <div className="w-1/3">
                                                                <label className="text-[10px] font-bold block mb-1">Temp (°C)</label>
                                                                <input 
                                                                    type="text" 
                                                                    value={temp.temp} 
                                                                    onChange={e => handleTempChange(temp.id, 'temp', e.target.value)}
                                                                    placeholder="e.g. -2.5"
                                                                    className={`w-full rounded p-1.5 text-xs ${inputBgClass}`}
                                                                />
                                                            </div>
                                                            <div className="pt-4">
                                                                <button onClick={() => removeTempPoint(temp.id)} className="bg-red-500/20 hover:bg-red-500/40 text-red-500 p-2 rounded text-xs transition font-bold">
                                                                    🗑️
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>

                                <div className={`${cardBgClass} p-3.5 sm:p-4 rounded-xl space-y-3.5`}>
                                    <div className="flex justify-between items-center cursor-pointer" onClick={() => setShowPstSection(!showPstSection)}>
                                        <h2 className={headerAccentClass}>
                                            🪚 Propagation Saw Tests (PST) {obs.pstTests.length > 0 ? `(${obs.pstTests.length})` : ''}
                                        </h2>
                                        <span className="text-xs font-bold text-cyan-400">{showPstSection ? '▲ Hide Section' : '▼ Show Section'}</span>
                                    </div>

                                    {showPstSection && (
                                        <div className="space-y-3 pt-2 border-t border-[#3A506B] solar-border">
                                            <div className="flex justify-between items-center">
                                                <p className="text-[11px] font-medium">Record Propagation Saw Test results (e.g. PST 35/100 (End)).</p>
                                                <button onClick={addPstTest} className={`text-xs px-3 py-1 rounded font-bold transition border ${isBright ? 'bg-black text-white border-black' : 'bg-slate-800 hover:bg-slate-700 text-cyan-400 border-slate-700'}`}>
                                                    + Add PST Test
                                                </button>
                                            </div>
                                            {obs.pstTests.length === 0 ? (
                                                <p className="text-xs text-slate-400 italic py-3 text-center font-medium">No PST tests recorded.</p>
                                            ) : (
                                                <div className="space-y-2">
                                                    {obs.pstTests.map(pst => (
                                                        <div key={pst.id} className={`p-2.5 rounded-lg flex items-center gap-3 ${subBoxBgClass}`}>
                                                            <div className="w-1/3">
                                                                <label className="text-[10px] font-bold block mb-1">Depth (cm)</label>
                                                                <input 
                                                                    type="number" 
                                                                    value={pst.depth} 
                                                                    onChange={e => handlePstChange(pst.id, 'depth', Number(e.target.value))}
                                                                    className={`w-full rounded p-1.5 text-xs ${inputBgClass}`}
                                                                />
                                                            </div>
                                                            <div className="w-2/3">
                                                                <label className="text-[10px] font-bold block mb-1">PST Result</label>
                                                                <input 
                                                                    type="text" 
                                                                    value={pst.result} 
                                                                    onChange={e => handlePstChange(pst.id, 'result', e.target.value)}
                                                                    placeholder="e.g. PST 35/100 (End)"
                                                                    className={`w-full rounded p-1.5 text-xs ${inputBgClass}`}
                                                                />
                                                            </div>
                                                            <div className="pt-4">
                                                                <button onClick={() => removePstTest(pst.id)} className="bg-red-500/20 hover:bg-red-500/40 text-red-500 p-2 rounded text-xs transition font-bold">
                                                                    🗑️
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'export' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div className={`${cardBgClass} p-6 rounded-xl text-center space-y-4 flex flex-col justify-between`}>
                                    <div>
                                        <h2 className="text-sm font-bold uppercase mb-2 text-cyan-400">CalTopo & Gaia GPS GPX Export</h2>
                                        <p className="text-xs font-medium max-w-sm mx-auto">Generate standard GPX waypoint exports containing your observation coordinates for seamless offline navigation.</p>
                                    </div>
                                    <button onClick={exportGPX} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-2.5 rounded-lg text-xs shadow transition w-full">
                                        Download GPX Waypoint File
                                    </button>
                                </div>

                                <div className={`${cardBgClass} p-6 rounded-xl text-center space-y-4 flex flex-col justify-between`}>
                                    <div>
                                        <h2 className="text-sm font-bold uppercase mb-2 text-cyan-400">CAAML v5.0 XML Schema Exporter</h2>
                                        <p className="text-xs font-medium max-w-sm mx-auto">Export your snow pit profile into standards-compliant XML format for professional forecasting center compatibility.</p>
                                    </div>
                                    <button onClick={exportCAAML} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-2.5 rounded-lg text-xs shadow transition w-full">
                                        Export CAAML v5.0 XML
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'logbook' && (
                            <div className="space-y-3">
                                <h2 className={headerAccentClass}>Saved Local Observations ({savedLogbook.length})</h2>
                                {savedLogbook.length === 0 ? (
                                    <p className={`text-xs italic p-6 text-center rounded-xl font-medium ${subBoxBgClass}`}>No saved observations in local memory yet.</p>
                                ) : (
                                    savedLogbook.map((item, idx) => (
                                        <div key={idx} className={`p-3.5 rounded-xl text-xs space-y-2 ${subBoxBgClass}`}>
                                            <div className="flex justify-between font-bold text-cyan-400">
                                                <span>{item.locationName || 'Untitled Location'}</span>
                                                <span className={isBright ? 'text-black' : 'text-slate-300'}>{item.elevation || '0'}ft ({item.aspect})</span>
                                            </div>
                                            <p className="font-medium">Observer: {item.observerName || 'N/A'} | Layers Logged: {item.layers.length} | HS: {item.totalSnowDepth || 'N/A'}cm | Slope: {item.slopeAngle || '0'}°</p>
                                            
                                            {item.instability?.avalanches && item.instability.avalanches.length > 0 && (
                                                <div className="text-[11px] font-mono space-y-1 border-t border-[#3A506B] pt-1 solar-border">
                                                    <span className="font-bold uppercase text-cyan-400">Recent Avalanches ({item.instability.avalanches.length}):</span>
                                                    {item.instability.avalanches.map((av, avIdx) => (
                                                        <div key={avIdx} className="pl-2">
                                                            • #{avIdx+1}: {av.size} / {av.rScale} {av.problemType || 'Unspecified'} ({av.trigger}), Elev: {av.elevation}ft ({av.aspect}), When: {av.timeFrame} {av.lat ? `[GPS: ${av.lat.toFixed(3)}, ${av.lng.toFixed(3)}]` : ''}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {item.photos && item.photos.length > 0 && (
                                                <div className="space-y-1 border-t border-[#3A506B] pt-1 solar-border">
                                                    <span className="font-bold uppercase text-cyan-400 text-[10px]">Attached Photos ({item.photos.length}):</span>
                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                                        {item.photos.map((photo, pIdx) => (
                                                            <div key={pIdx} className={`rounded p-1 flex flex-col items-center ${subBoxBgClass}`}>
                                                                <img src={photo.url} alt={photo.name} className="w-full h-16 object-cover rounded" />
                                                                <span className="text-[9px] truncate w-full px-1 text-center mt-0.5 font-mono">{photo.name}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}

                                            {item.snowTemps && item.snowTemps.length > 0 && (
                                                <div className="text-[11px] font-mono font-bold text-amber-500">
                                                    Temperatures: {item.snowTemps.map(t => `${t.depth}cm (${t.temp}°C)`).join(', ')}
                                                </div>
                                            )}
                                            {item.layers.some(l => l.stabilityTest) && (
                                                <div className="text-[11px] font-mono font-bold text-emerald-500">
                                                    Stability Tests: {item.layers.filter(l => l.stabilityTest).map(l => `${l.topDepth}cm (${l.stabilityTest})`).join(', ')}
                                                </div>
                                            )}
                                            {item.pstTests && item.pstTests.length > 0 && (
                                                <div className="text-[11px] font-mono font-bold text-cyan-400">
                                                    PST Tests: {item.pstTests.map(p => `${p.depth}cm: ${p.result}`).join(' | ')}
                                                </div>
                                            )}
                                            {item.generalNotes && <p className="italic border-t border-[#3A506B] pt-1 mt-1 solar-border">"{item.generalNotes}"</p>}
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                    </main>

                    <footer className={`px-3 py-2.5 flex justify-between items-center text-xs solar-header ${isBright ? 'bg-[#0F172A] text-white border-t-2 border-black' : 'bg-[#0B132B] border-t border-[#3A506B]'}`}>
                        <span className="font-mono text-[11px] text-cyan-300 font-bold">GPS: {obs.lat !== 0 || obs.lng !== 0 ? `${obs.lat.toFixed(3)}, ${obs.lng.toFixed(3)}` : 'Not Set'}</span>
                        <span className="italic text-[11px] font-bold text-slate-300">SnowSlate Suite v2.0</span>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
